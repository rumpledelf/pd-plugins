<div class="gears-module">
  <svg class="gears-stage" viewBox="0 0 400 180" aria-label="Two meshing gears turn in opposite directions. Drag either gear to turn them.">
    <g class="gears-pair"></g>
    <g fill="currentColor" text-anchor="middle" font-size="13"><text class="gears-left-label" y="171">18 teeth</text><text class="gears-right-label" y="171">36 teeth</text></g>
  </svg>
  <div class="gears-controls"><button class="gears-play" type="button" aria-pressed="false">Play</button><label>Left <select class="gears-size-left" aria-label="Left gear tooth count"><option value="12">12</option><option value="18" selected>18</option><option value="27">27</option><option value="36">36</option><option value="54">54</option><option value="72">72</option></select></label><label>Right <select class="gears-size" aria-label="Right gear tooth count"><option value="12">12</option><option value="18">18</option><option value="27">27</option><option value="36" selected>36</option><option value="54">54</option><option value="72">72</option></select></label><button class="gears-reverse" type="button">Reverse</button></div>
  <p class="gears-ratio" aria-live="polite">Left: 2 turns ↻ · Right: 1 turn ↺</p>
</div>
