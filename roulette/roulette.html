<div class="roulette-module">
  <svg class="roulette-wheel" viewBox="0 0 360 360" role="img" aria-label="European roulette wheel with one zero. Tap to spin.">
    <circle cx="180" cy="180" r="170" fill="gainsboro" stroke="#333333" stroke-width="3"/>
    <circle cx="180" cy="180" r="161" fill="none" stroke="#999999" stroke-width="8"/>
    <g class="roulette-rotor"></g>
    <circle class="roulette-ball" cx="180" cy="22" r="5" fill="white" stroke="#333333" stroke-width="1.2"/>
  </svg>
  <div class="roulette-controls"><button type="button" class="roulette-spin">Spin</button><span class="roulette-result" aria-live="polite">Spin the wheel.</span></div>
</div>
