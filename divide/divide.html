<div class="divide-module arithmetic-layout">
  <input class="divide-first" type="text" maxlength="6" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="First number">
  <span class="arithmetic-sign" aria-hidden="true">÷</span>
  <input class="divide-second" type="text" maxlength="6" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Divide by">
  <span class="arithmetic-sign" aria-hidden="true">=</span>
  <input class="divide-quotient" type="text" maxlength="6" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Quotient, the whole-number answer" placeholder="?">
  <span class="divide-feedback arithmetic-result" role="status" aria-live="polite"></span>
  <button class="divide-new arithmetic-random grey" type="button">Random</button>
  <div class="arithmetic-actions">
    <label class="divide-leftover">Remainder<input class="divide-remainder" type="text" maxlength="6" inputmode="numeric" autocomplete="off" spellcheck="false" value="0" aria-label="Remainder, what is left over"></label>
    <button type="button" class="divide-check">Check</button>
    <button class="divide-show" type="button">Show answer</button>
  </div>
</div>
