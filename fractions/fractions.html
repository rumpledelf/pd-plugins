<div class="fractions-module">
  <div class="fractions-column fractions-pizza-col">
    <div class="fractions-pizza-container" id="fractions-pizza-wrap">
      <!-- SVG Pizza will be dynamically constructed / animated in JS -->
    </div>
  </div>
  <div class="fractions-column fractions-controls-col">
    <fieldset class="fractions-fieldset">
      <legend>Select a fraction:</legend>
      <div class="fractions-radio-grid">
        <label class="fractions-radio-item">
          <input type="radio" name="fractions-choice" value="1/2">
          <span>1/2 (One half)</span>
        </label>
        <label class="fractions-radio-item">
          <input type="radio" name="fractions-choice" value="1/4">
          <span>1/4 (One quarter)</span>
        </label>
        <label class="fractions-radio-item">
          <input type="radio" name="fractions-choice" value="1/3">
          <span>1/3 (One third)</span>
        </label>
        <label class="fractions-radio-item">
          <input type="radio" name="fractions-choice" value="2/3">
          <span>2/3 (Two thirds)</span>
        </label>
        <label class="fractions-radio-item">
          <input type="radio" name="fractions-choice" value="3/4">
          <span>3/4 (Three quarters)</span>
        </label>
        <label class="fractions-radio-item">
          <input type="radio" name="fractions-choice" value="1/6">
          <span>1/6 (One sixth)</span>
        </label>
      </div>
    </fieldset>
    <p class="fractions-status" id="fractions-status" aria-live="polite"></p>
  </div>
</div>
