<div class="sort-module">
  <svg class="sort-stage" viewBox="0 0 580 205" aria-label="Russian dolls. Arrange in size order, smallest to largest or largest to smallest.">
    <defs>
      <linearGradient id="sort-apron" x2="0" y2="1"><stop stop-color="white"/><stop offset="1" stop-color="gainsboro"/></linearGradient>
      <radialGradient id="sort-face" cx="38%" cy="28%" r="75%"><stop stop-color="white"/><stop offset="1" stop-color="gainsboro"/></radialGradient>
    </defs>
    <g class="sort-slots" aria-hidden="true"></g>
    <g class="sort-dolls"></g>
  </svg>
  <div class="sort-footer"><span class="sort-message" aria-live="polite">Put the dolls in size order.</span><button type="button" class="sort-shuffle">Shuffle</button></div>
  <span class="sort-help" id="sort-help">Keyboard: Space to pick up or put down, arrow keys to move, Escape to cancel.</span>
</div>
