<div class="chords-module">
  <div class="chords-controls">
    <label>Root <select class="chords-root" aria-label="Chord root"></select></label>
    <label>Chord <select class="chords-quality" aria-label="Chord quality"><option value="major">Major</option><option value="minor">Minor</option></select></label>
    <button type="button" class="chords-play">Play chord</button>
  </div>
  <div class="chords-keyboard" role="group" aria-label="Piano keys"></div>
  <p class="chords-status" aria-live="polite">C major · C E G</p>
</div>
