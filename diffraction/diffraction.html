<div class="diffraction-module">
  <canvas class="diffraction-view" width="1240" height="328" role="img" aria-label="Green light passes through five slits and makes bright and dark bands on a screen."></canvas>
  <div class="diffraction-controls">
    <label>Slit width <input class="diffraction-width" type="range" min="0.4" max="2.5" step="0.1" value="0.8" aria-label="Slit width"><output class="diffraction-width-value">0.8 λ</output></label>
    <label>Slit spacing <input class="diffraction-spacing" type="range" min="3" max="8" step="0.1" value="5" aria-label="Distance between slit centres"><output class="diffraction-spacing-value">5.0 λ</output></label>
  </div>
  <p class="diffraction-hint">Narrower slits spread the light. Closer slits spread the bright bands.</p>
</div>
