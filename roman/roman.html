<form class="roman-converter">
  <label class="roman-source" for="roman-decimal">Decimal</label>
  <label class="roman-destination" for="roman-value">Roman numerals</label>
  <input id="roman-decimal" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="roman-message">
  <div class="roman-actions">
    <button type="submit" class="blue">Convert</button>
    <button type="button" class="grey" id="roman-clear">Clear</button>
  </div>
  <input id="roman-value" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="roman-message">
  <p id="roman-message" aria-live="polite"></p>
</form>
