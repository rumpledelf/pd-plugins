<form class="arithmetic-module arithmetic-layout">
  <input class="arithmetic-first" type="text" inputmode="numeric" maxlength="13" aria-label="First number" autocomplete="off" spellcheck="false">
  <span class="arithmetic-sign" aria-hidden="true">−</span>
  <input class="arithmetic-second" type="text" inputmode="numeric" maxlength="13" aria-label="Second number" autocomplete="off" spellcheck="false">
  <span class="arithmetic-sign" aria-hidden="true">=</span>
  <input class="arithmetic-answer" type="text" inputmode="numeric" maxlength="14" aria-label="Your answer" autocomplete="off" spellcheck="false" placeholder="?">
  <span class="arithmetic-status arithmetic-result" role="status" aria-live="polite"></span>
  <button class="arithmetic-new arithmetic-random grey" type="button">Random</button>
  <div class="arithmetic-actions">
    <button type="submit">Check</button>
    <button class="arithmetic-reveal" type="button">Show answer</button>
  </div>
</form>
