<form class="binary-converter">
  <label class="binary-source" for="binary-decimal">Decimal</label>
  <label class="binary-destination" for="binary-value">Binary</label>
  <input id="binary-decimal" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="binary-message">
  <div class="binary-actions">
    <button type="submit" class="blue">Convert</button>
    <button type="button" class="grey" id="binary-clear">Clear</button>
  </div>
  <input id="binary-value" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="binary-message">
  <p id="binary-message" aria-live="polite"></p>
</form>
