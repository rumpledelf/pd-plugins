<form class="multiply-module arithmetic-layout">
  <input class="multiply-first" type="text" inputmode="numeric" maxlength="101" aria-label="First number" autocomplete="off" spellcheck="false">
  <span class="arithmetic-sign" aria-hidden="true">×</span>
  <input class="multiply-second" type="text" inputmode="numeric" maxlength="101" aria-label="Second number" autocomplete="off" spellcheck="false">
  <span class="arithmetic-sign" aria-hidden="true">=</span>
  <input class="multiply-answer" type="text" inputmode="numeric" maxlength="201" aria-label="Your answer" autocomplete="off" spellcheck="false" placeholder="?">
  <span id="multiply-feedback" class="arithmetic-result" role="status" aria-live="polite"></span>
  <button class="multiply-new arithmetic-random grey" type="button">Random</button>
  <div class="arithmetic-actions">
    <button type="submit">Check</button>
    <button class="multiply-show" type="button">Show answer</button>
  </div>
</form>
