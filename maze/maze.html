<div class="maze-module">
  <div class="maze-toolbar"><button class="maze-new" type="button">New maze</button><span>Help the mouse find the cheese.</span></div>
  <svg class="maze-stage" viewBox="0 0 370 370" role="group" aria-label="Mouse maze. Drag or swipe. Click the maze, then use arrow keys." tabindex="0">
    <g class="maze-walls" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="square"></g>
    <text x="345" y="313" font-size="26" text-anchor="middle" dominant-baseline="central" aria-hidden="true">🧀</text>
    <g class="maze-player" transform="translate(25 57)" pointer-events="all">
      <circle r="16" fill="transparent"/>
      <g class="maze-mouse">
        <path d="M-8 1Q-15-8-14 2" fill="none" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
        <ellipse rx="9" ry="6.5" fill="#999999" stroke="#333333" stroke-width="1"/>
        <path d="M2-6Q12-5 13 0Q12 5 2 6Z" fill="#999999" stroke="#333333" stroke-width="1"/>
        <circle cx="3" cy="-6" r="3.5" fill="gainsboro" stroke="#333333" stroke-width="1"/>
        <circle cx="3" cy="6" r="3.5" fill="gainsboro" stroke="#333333" stroke-width="1"/>
        <circle cx="8" cy="-2.5" r="1" fill="#333333"/><circle cx="8" cy="2.5" r="1" fill="#333333"/><circle cx="13" cy="0" r="1.7" fill="#333333"/>
      </g>
    </g>
  </svg>
  <div class="maze-controls" aria-label="Move the mouse">
    <button type="button" data-direction="3" aria-label="Move left"><span class="material-symbols-outlined maze-caret" aria-hidden="true">chevron_right</span></button>
    <button type="button" data-direction="0" aria-label="Move up"><span class="material-symbols-outlined maze-caret" aria-hidden="true">chevron_right</span></button>
    <button type="button" data-direction="2" aria-label="Move down"><span class="material-symbols-outlined maze-caret" aria-hidden="true">chevron_right</span></button>
    <button type="button" data-direction="1" aria-label="Move right"><span class="material-symbols-outlined maze-caret" aria-hidden="true">chevron_right</span></button>
  </div>
  <p class="maze-status" aria-live="polite">Drag or swipe. Click the maze, then use arrow keys.</p>
</div>
